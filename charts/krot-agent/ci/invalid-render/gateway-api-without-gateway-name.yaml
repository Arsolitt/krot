# MUST fail the render (not the schema): an HTTPRoute parentRef without a name
# is refused by the API server (`spec.parentRefs[0].name: Required value`), and
# there is no cluster-wide default Gateway to fall back on. The schema requires
# the key, so only an explicitly empty value reaches the template, and the
# template refuses it.
#
# expect-error: gatewayAPI.gatewayName is required when gatewayAPI.enabled is true
image:
  repository: ghcr.io/arsolitt/krot-agent

cpUrl: http://krot-cp:8080
agentTokenSecretName: krot-agent

nodes:
  - name: vpn1
    endpoint: vpn1.ci.example
    inbounds:
      - {tag: vless-ws-ddg, type: vless_ws, listenPort: 9443, sni: front.ci.example}

wsIngress:
  className: nginx

gatewayAPI:
  enabled: true
  gatewayName: ""

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
