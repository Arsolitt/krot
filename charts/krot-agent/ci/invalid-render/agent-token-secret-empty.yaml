# MUST fail the render (not the schema): the agent reads its token from a
# secretKeyRef, and an empty secret name renders `secretKeyRef: {name: ""}` -
# which the API server refuses (`spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name:
# Required value`). The schema requires the key, so only an explicitly empty
# value reaches the template, and the template refuses it.
#
# expect-error: agentTokenSecretName is required
image:
  repository: ghcr.io/arsolitt/krot-agent

cpUrl: http://krot-cp:8080
agentTokenSecretName: ""

nodes:
  - name: vpn1
    endpoint: vpn1.ci.example
    inbounds:
      - {tag: vless-in, type: vless_reality, listenPort: 8443, sni: cdn.ci.example}

wsIngress:
  className: nginx

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
