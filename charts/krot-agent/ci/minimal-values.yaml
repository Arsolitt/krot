# Scenario: smallest supported install - the chart installed before any node is
# declared.
#
# `nodes: []` renders no workload at all, which is a valid way to install the
# chart and add nodes later. The cpUrl is still required by the schema, so the
# operator has to know the control-plane address from the start.
image:
  repository: ghcr.io/arsolitt/krot-agent
  tag: ""
  pullPolicy: IfNotPresent

cpUrl: http://krot-cp:8080
pollInterval: 60s
agentTokenSecretName: krot-agent
dnsPolicy: Default

nodes: []

wsIngress:
  className: nginx
  tlsSecretName: ""
  readTimeout: "3600"

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
