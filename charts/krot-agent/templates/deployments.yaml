{{- range .Values.nodes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krot-agent-{{ .name }}
  labels:
    app.kubernetes.io/name: krot-agent
    app.kubernetes.io/instance: krot-agent-{{ .name }}
spec:
  # hostNetwork port collisions block rolling updates on the pinned node.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krot-agent
      app.kubernetes.io/instance: krot-agent-{{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krot-agent
        app.kubernetes.io/instance: krot-agent-{{ .name }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .node }}
      nodeSelector:
        kubernetes.io/hostname: {{ . }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: {{ default "Default" $.Values.dnsPolicy | quote }}
      securityContext:
        fsGroup: 2222
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: krot-agent
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: KROT_CP_URL
              value: {{ $.Values.cpUrl | quote }}
            - name: KROT_POLL_INTERVAL
              value: {{ default "30s" $.Values.pollInterval | quote }}
            - name: KROT_HEALTH_ADDR
              value: 0.0.0.0:18081
            - name: KROT_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.agentTokenSecretName }}
                  key: token
          ports:
            - name: http
              containerPort: 18081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
          volumeMounts:
            - name: workdir
              mountPath: /etc/krot
            - name: spec
              mountPath: /etc/krot/agent.yaml
              subPath: agent.yaml
              readOnly: true
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                # NET_RAW: SO_MARK on outbound UDP sockets (kernel >= 5.17)
                # for interface-bound egress; without it UDP relay flows fail
                # with "listen udp4 :0: operation not permitted".
                - NET_RAW
                # NET_BIND_SERVICE: reserved for a future privileged-port move.
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1111
            runAsGroup: 2222
      volumes:
        - name: workdir
          emptyDir: {}
        - name: spec
          configMap:
            name: krot-agent-spec-{{ .name }}
---
{{- end }}
