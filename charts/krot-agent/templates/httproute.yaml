{{- $cfg := .Values.gatewayAPI }}
{{- if .Values.gatewayAPI.enabled }}
{{- range $node := .Values.nodes }}
{{- range $in := $node.inbounds }}
{{- if eq $in.type "vless_ws" }}
# Gateway API alternative to the wsIngress objects: one HTTPRoute per node and
# vless_ws inbound, attached to an existing Gateway whose listener terminates
# TLS. wsIngress stays independent. The nginx idle-timeout annotations have no
# equivalent here - the Gateway listener's timeouts govern the websockets.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: krot-agent-{{ $node.name }}-{{ $in.tag }}
  labels:
    app.kubernetes.io/name: krot-agent
    app.kubernetes.io/instance: krot-agent-{{ $node.name }}
spec:
  parentRefs:
    - name: {{ required "gatewayAPI.gatewayName is required when gatewayAPI.enabled is true" $cfg.gatewayName }}
      {{- with $cfg.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
  hostnames:
    - {{ $in.sni }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $in.wsPath | default "/" }}
      backendRefs:
        - name: krot-agent-{{ $node.name }}
          port: {{ $in.listenPort }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
