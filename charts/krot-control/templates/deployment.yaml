apiVersion: apps/v1
kind: Deployment
metadata:
  name: krot-cp
  labels:
    app.kubernetes.io/name: krot-cp
    app.kubernetes.io/instance: krot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krot-cp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krot-cp
        app.kubernetes.io/instance: krot
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 2222
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: krot-cp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: krot-cp-config
            - secretRef:
                name: {{ required "secretName is required: an empty name renders a secretRef the API server refuses" .Values.secretName }}
          {{- if .Values.databaseTLS.enabled }}
          # pgx (the driver behind KROT_DATABASE_URL) reads these for both the
          # migrations and the serving connection; an explicit sslmode or
          # sslrootcert in the DSN wins over the environment.
          env:
            - name: PGSSLROOTCERT
              value: /etc/krot/pg-tls/ca.crt
            - name: PGSSLMODE
              value: {{ .Values.databaseTLS.sslmode | quote }}
            {{- with .Values.databaseTLS.clientSecretName }}
            - name: PGSSLCERT
              value: /etc/krot/pg-tls/tls.crt
            - name: PGSSLKEY
              value: /etc/krot/pg-tls/tls.key
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.databaseTLS.enabled }}
          volumeMounts:
            - name: pg-tls
              mountPath: /etc/krot/pg-tls
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1111
            runAsGroup: 2222
      {{- if .Values.databaseTLS.enabled }}
      volumes:
        - name: pg-tls
          projected:
            sources:
              - secret:
                  name: {{ required "databaseTLS.caSecretName is required when databaseTLS.enabled is true" .Values.databaseTLS.caSecretName }}
                  items:
                    - key: {{ .Values.databaseTLS.caKey }}
                      path: ca.crt
              {{- with .Values.databaseTLS.clientSecretName }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $.Values.databaseTLS.certKey }}
                      path: tls.crt
                    - key: {{ $.Values.databaseTLS.keyKey }}
                      path: tls.key
              {{- end }}
      {{- end }}
