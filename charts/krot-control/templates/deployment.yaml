apiVersion: apps/v1
kind: Deployment
metadata:
  name: krot-cp
  labels:
    app.kubernetes.io/name: krot-cp
    app.kubernetes.io/instance: krot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: krot-cp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krot-cp
        app.kubernetes.io/instance: krot
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 2222
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: krot-cp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: krot-cp-config
            - secretRef:
                name: {{ required "secretName is required: an empty name renders a secretRef the API server refuses" .Values.secretName }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1111
            runAsGroup: 2222
