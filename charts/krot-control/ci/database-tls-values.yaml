# Scenario: PostgreSQL reached with sslmode=verify-full, CA and client pair
# mounted.
#
# Exercises the databaseTLS branch: the projected volume, the read-only mount
# at /etc/krot/pg-tls and the PGSSLROOTCERT/PGSSLMODE exports render only when
# enabled, and a non-empty clientSecretName adds the client source and the
# PGSSLCERT/PGSSLKEY exports. The DSN in the Secret needs no TLS parameters.
image:
  repository: ghcr.io/arsolitt/krot-cp
  tag: ""
  pullPolicy: IfNotPresent

secretName: krot-cp-secrets

ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""

databaseTLS:
  enabled: true
  sslmode: verify-full
  caSecretName: krot-pg-ca
  caKey: ca.crt
  clientSecretName: krot-pg-client
  certKey: tls.crt
  keyKey: tls.key

config:
  KROT_IDP: authentik
  KROT_BASE_URL: https://vpn.ci.example
  KROT_OIDC_ISSUER: https://idp.ci.example
  KROT_AUTHENTIK_URL: https://auth.ci.example
  KROT_AUTHENTIK_GROUP: krot::vpn
  KROT_AUTHENTIK_ADMIN_GROUP: krot::admins
  KROT_LISTEN_ADDR: :8080

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}
