# MUST fail the render (not the schema): the Deployment consumes the Secret with
# envFrom, and an empty name renders `secretRef: {name: ""}` - which the API
# server refuses (`spec.template.spec.containers[0].envFrom[1].secretRef.name:
# Required value`). The schema requires the key, so only an explicitly empty
# value reaches the template, and the template refuses it.
#
# expect-error: secretName is required
image:
  repository: ghcr.io/arsolitt/krot-cp

secretName: ""

config:
  KROT_IDP: authentik

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}
