# Control-plane image. tag "" falls back to .Chart.AppVersion.
image:
  repository: ghcr.io/arsolitt/krot-cp
  tag: ""            # empty = .Chart.AppVersion
  pullPolicy: IfNotPresent

# Attach one or more image pull secrets to the pod, e.g.
#   imagePullSecrets: [{name: ghcr-pull}]
imagePullSecrets: []

# Extra metadata merged onto the pod template.
podAnnotations: {}
podLabels: {}

# Out-of-band Secret, envFrom-merged alongside the ConfigMap. It carries what
# the ConfigMap must not: KROT_TOKEN_KEY, KROT_COOKIE_KEY, KROT_OIDC_CLIENT_ID,
# KROT_OIDC_CLIENT_SECRET, KROT_DATABASE_URL, KROT_AGENT_TOKEN, and the
# provider API token of the configured KROT_IDP (KROT_AUTHENTIK_TOKEN or
# KROT_ZITADEL_TOKEN). Keys are the variable names themselves.
secretName: krot-cp-secrets

# Ingress is opt-in: enable it and set host to expose the portal, the
# subscription endpoints and the public Happ routing routes. tlsSecret empty
# renders the Ingress without a tls block.
ingress:
  enabled: false
  className: nginx
  host: ""
  tlsSecret: ""

# Gateway API alternative to the Ingress above: publish through an
# operator-owned Gateway (Envoy Gateway, Cilium, ...) with an HTTPRoute. The
# listener on that Gateway terminates TLS; the chart creates no certificate.
# The name and the host are required whenever enabled - a hostless HTTPRoute
# would match every host the listener serves, capturing traffic meant for
# other routes - and an empty namespace means the Gateway lives in the
# release namespace.
gatewayAPI:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  host: ""

# PostgreSQL TLS material for sslmode=verify-full/verify-ca. The Secrets are
# projected into the pod at the fixed path /etc/krot/pg-tls and the paths are
# exported as PGSSLROOTCERT/PGSSLMODE (plus PGSSLCERT/PGSSLKEY when
# clientSecretName is set), which pgx reads for the migration and serving
# connections alike. The DSN in KROT_DATABASE_URL needs no TLS parameters;
# an explicit sslmode/sslrootcert in it wins over the environment.
databaseTLS:
  enabled: false
  sslmode: verify-full
  caSecretName: ""
  caKey: ca.crt
  clientSecretName: ""
  certKey: tls.crt
  keyKey: tls.key

# Non-secret environment, rendered into the krot-cp-config ConfigMap.
# KROT_IDP selects the identity provider (authentik or zitadel); only the
# selected provider's URL/group/role keys are read.
config:
  KROT_IDP: authentik
  KROT_BASE_URL: ""
  # HMAC namespace prefix of subscription tokens, used verbatim. Set
  # cheburnet-sub: to keep URLs issued by a pre-rename corporate instance valid.
  KROT_TOKEN_NAMESPACE: "krot-sub:"
  KROT_OIDC_ISSUER: ""
  KROT_AUTHENTIK_URL: ""
  KROT_AUTHENTIK_GROUP: krot::vpn
  KROT_AUTHENTIK_ADMIN_GROUP: krot::admins
  KROT_ZITADEL_URL: ""
  KROT_ZITADEL_PROJECT_ID: ""
  KROT_ZITADEL_ROLE: vpn
  KROT_ZITADEL_ADMIN_ROLE: vpn-admin
  KROT_CACHE_TTL: 60s
  KROT_GRACE: 24h
  KROT_SESSION_TTL: 720h
  KROT_SYNC_INTERVAL: 60s
  KROT_PROFILE_TITLE: Krot VPN
  KROT_PROFILE_SUPPORT_URL: ""
  KROT_PROFILE_UPDATE_INTERVAL_HOURS: "24"
  KROT_LISTEN_ADDR: :8080

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 256Mi}
