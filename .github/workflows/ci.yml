# Single pipeline: quality gate on every change, release on a tag.
#
# Job ids are the status-check contexts (`lint`, `test`, `charts`, `schema`,
# `licenses`, `release-tag`); the first five are meant to be required on pull
# requests.
# There is deliberately no `paths:` filter on `pull_request` - a job skipped by
# a path filter never reports a status, so requiring it would block every merge
# that does not touch those paths.
#
#   lint         golangci-lint and the templ formatter over the Go tree.
#   test         go vet, the test suite against a PostgreSQL service, and a
#                full build of both binaries.
#   charts       helm lint for both charts, plus a render of each with the
#                values a real install uses.
#   schema       proves the chart guardrails still have teeth: every
#                ci/*-values.yaml scenario renders, every ci/invalid/*.yaml is
#                refused by values.schema.json, and every
#                ci/invalid-render/*.yaml is refused by a template that names
#                the value in its `# expect-error:` line.
#   licenses     regenerates the third-party license bundle (licenses/ and the
#                two chart LICENSE copies) and fails if the committed result
#                differs, so a dependency change cannot land without its
#                notices.
#   release-tag  runs on a `release-*` tag: the version is either
#                `<major>.<minor>.<patch>` (the stable track) or
#                `<major>.<minor>.<patch>-rc.<n>` (the release candidate track),
#                the CHANGELOG.md section the release body comes from has to
#                exist, and the tagged commit has to be on main. It fails in
#                seconds, before the rest of the pipeline starts.
#
# A `release-*` tag push runs the same gates and then publishes; nothing else
# publishes. The tag carries the version, so nothing in the tree is bumped by
# hand: the release job stamps it into both packaged charts (`helm package
# --version` / `--app-version`) and records it in `charts/*/Chart.yaml` on main
# afterwards.
#
#   images       builds and pushes ghcr.io/arsolitt/krot-cp and krot-agent for
#                linux/amd64, tagged with the version (and `latest` on the
#                stable track only). The arm64 leg needed QEMU emulation and
#                dominated the release wall-clock time; re-add `linux/arm64` to
#                `platforms` and the `docker/setup-qemu-action` step to publish
#                it.
#   release      needs every job above: it packages the charts at the tag's
#                version, creates the GitHub release with the CHANGELOG section
#                as its body, attaches the license bundle (LICENSE + licenses/,
#                as krot-licenses-<version>.tar.gz), publishes the chart
#                repository index on gh-pages, and records the released version
#                on main.
#
# Tool pins live in `env:` below; Dependabot keeps the actions themselves fresh.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'release-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One pin per tool, no `@latest` anywhere; Dependabot bumps the actions below.
  GO_VERSION_FILE: go.mod
  GOLANGCI_LINT_VERSION: v2.13.2
  HELM_VERSION: 4.2.4
  CHART_RELEASER_VERSION: v1.8.1
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # Oldest and newest Kubernetes releases the rendered manifests are checked
  # against. kubeconform fetches these schemas from yannh/kubernetes-json-schema.
  KUBERNETES_VERSIONS: 1.31.0 1.37.0

jobs:
  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Generate templ sources
        run: go tool templ generate ./internal/web
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Check templ formatting
        run: go tool templ fmt -fail .

  test:
    name: Test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_PASSWORD: krot
          POSTGRES_DB: krot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KROT_TEST_DATABASE_URL: postgres://postgres:krot@127.0.0.1:5432/krot?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Generate templ sources
        run: go tool templ generate ./internal/web
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: make build

  charts:
    name: Lint and validate charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          helm version --short
          kubeconform -v

      # values.schema.json is applied by every helm command, so lint failures
      # here cover both template shape and chart-level value validation.
      - name: helm lint
        run: |
          set -euo pipefail
          for chart in charts/krot-control charts/krot-agent; do
            helm lint --strict "$chart"
            for values in "$chart"/ci/*-values.yaml; do
              echo "::group::helm lint --strict $chart -f $values"
              helm lint --strict "$chart" -f "$values"
              echo "::endgroup::"
            done
          done

      # The chart defaults are a supported install too, and they are what most
      # users get: the release job packages the tagged tree as-is, so validating
      # only the fixtures would leave the published configuration unchecked.
      #
      # krot-agent renders nothing with its defaults (`nodes: []` is a valid
      # install before any node is declared), so its default render is validated
      # with one node - the smallest configuration that produces a workload.
      - name: Render and check against Kubernetes schemas
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/krot-manifests.yaml"
          validate() {
            local chart="$1" label="$2"
            shift 2
            for k8s in $KUBERNETES_VERSIONS; do
              echo "::group::$chart $label on Kubernetes $k8s"
              # Render to a .yaml file before validating: kubeconform keys off
              # the file extension, and input it does not recognise is reported
              # as "0 resource found" with exit code 0 - a silent no-op.
              helm template ci "$chart" "$@" > "$manifest"
              expected=$(grep -c '^kind:' "$manifest" || true)
              if [ "$expected" -eq 0 ]; then
                echo "::error::$chart $label rendered no resources"
                exit 1
              fi
              summary=$(kubeconform -strict -summary -kubernetes-version "$k8s" \
                -schema-location default "$manifest")
              echo "$summary"
              if ! grep -qE "Summary: $expected resources? found" <<<"$summary"; then
                echo "::error::$chart $label: kubeconform validated an unexpected number of resources (rendered $expected)"
                exit 1
              fi
              # A skipped resource is a kind with no schema - the check above
              # would still pass, so it is worth its own failure: without it a
              # new CRD kind would be rendered and never validated.
              if ! grep -q 'Skipped: 0' <<<"$summary"; then
                echo "::error::$chart $label: kubeconform skipped resources, so a kind has no schema"
                exit 1
              fi
              echo "::endgroup::"
            done
          }
          validate charts/krot-control "default values"
          for values in charts/krot-control/ci/*-values.yaml; do
            validate charts/krot-control "$(basename "$values")" -f "$values"
          done
          validate charts/krot-agent "default values with one node" \
            --set cpUrl=http://krot-cp:8080 \
            --set nodes[0].name=vpn1 \
            --set nodes[0].endpoint=vpn1.example.com \
            --set nodes[0].inbounds[0].tag=vless-in \
            --set nodes[0].inbounds[0].type=vless_reality \
            --set nodes[0].inbounds[0].listenPort=8443 \
            --set nodes[0].inbounds[0].sni=cdn.example.com
          for values in charts/krot-agent/ci/*-values.yaml; do
            validate charts/krot-agent "$(basename "$values")" -f "$values"
          done

  schema:
    name: Value schema guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # The schema is only worth having if it still refuses impossible values:
      # weakening it (or dropping it) has to break this job, not pass silently.
      - name: Impossible values must be rejected
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for chart in charts/krot-control charts/krot-agent; do
            fixtures=("$chart"/ci/invalid/*.yaml)
            if [ "${#fixtures[@]}" -eq 0 ]; then
              echo "::error::no fixtures under $chart/ci/invalid/ - this check would pass without validating anything"
              exit 1
            fi
            for values in "${fixtures[@]}"; do
              if out=$(helm template ci "$chart" -f "$values" 2>&1); then
                echo "::error file=$values::$values was accepted, but it must be rejected by $chart/values.schema.json"
                status=1
              elif ! grep -qi schema <<<"$out"; then
                echo "::error file=$values::$values failed for an unexpected reason (not schema validation):"
                echo "$out"
                status=1
              else
                echo "rejected as expected: $values"
              fi
            done
          done
          exit $status

      # Not every impossible value is a schema question: an empty cpUrl or an
      # empty secret name is a shape the schema accepts and a template has to
      # refuse, because the refusal belongs to the value's consumer. The refusal
      # has to be the template's own and it has to name the value that caused
      # it, which every fixture declares in an `# expect-error:` line.
      - name: Values the templates must refuse
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          for chart in charts/krot-control charts/krot-agent; do
            fixtures=("$chart"/ci/invalid-render/*.yaml)
            if [ "${#fixtures[@]}" -eq 0 ]; then
              echo "::error::no fixtures under $chart/ci/invalid-render/ - this check would pass without validating anything"
              exit 1
            fi
            for values in "${fixtures[@]}"; do
              expected=$(sed -n 's/^# expect-error: //p' "$values")
              if [ -z "$expected" ]; then
                echo "::error file=$values::$values has no '# expect-error: <substring>' line naming the value the render must report"
                status=1
                continue
              fi
              if out=$(helm template ci "$chart" -f "$values" 2>&1); then
                echo "::error file=$values::$values rendered, but a template has to refuse it ($expected)"
                status=1
                continue
              fi
              if grep -qi schema <<<"$out"; then
                echo "::error file=$values::$values was rejected by values.schema.json, not by the template that owns the rule ($expected):"
                echo "$out"
                status=1
                continue
              fi
              if ! grep -qF "$expected" <<<"$out"; then
                echo "::error file=$values::$values was refused without naming '$expected':"
                echo "$out"
                status=1
                continue
              fi
              echo "refused by a template as expected: $values ($expected)"
            done
          done
          exit $status

      - name: Supported value shapes must keep working
        run: |
          set -euo pipefail
          for chart in charts/krot-control charts/krot-agent; do
            for values in "$chart"/ci/*-values.yaml; do
              helm template ci "$chart" -f "$values" > /dev/null
              echo "rendered: $values"
            done
          done

      # krot-agent renders nothing with `nodes: []`, which is a supported
      # install (the chart is installed before any node is declared) and the
      # reason its default render is validated with one node instead. The
      # property is asserted here so a template that started emitting a
      # half-configured workload for an empty list would fail.
      - name: An empty nodes list renders no workload
        run: |
          set -euo pipefail
          out=$(helm template ci charts/krot-agent --set cpUrl=http://krot-cp:8080)
          if [ -n "$out" ]; then
            echo "::error::charts/krot-agent rendered resources for an empty nodes list:"
            echo "$out"
            exit 1
          fi
          echo "an empty nodes list renders nothing, as documented"

  # The bundle under licenses/ and the two chart LICENSE copies are distilled
  # from the module graph, so a dependency bump has to carry its notices with
  # it. Regenerating here and diffing is what keeps the committed bundle
  # trustworthy without trusting the contributor's machine.
  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
      - name: Regenerate the license bundle
        run: make licenses

      # A brand-new file has to fail this too, not just an edited one: the
      # intent-to-add records the path without a blob, so untracked files show
      # up in the diff below. The diff is against HEAD on purpose - plain
      # `git diff` compares against the index, and `git add` stages a deletion
      # there, which would let a file dropped from the bundle slip through.
      - name: The committed bundle has to match
        run: |
          set -euo pipefail
          git add --intent-to-add licenses
          if ! git diff HEAD --exit-code -- licenses charts/krot-control/LICENSE charts/krot-agent/LICENSE; then
            echo "::error::the generated license bundle is out of date - run make licenses and commit the result"
            exit 1
          fi
          echo "the committed license bundle is up to date"

  # The tag is a release request: its shape, the CHANGELOG section the release
  # body comes from, and the branch it was cut from are checked here, before the
  # rest of the pipeline starts.
  release-tag:
    name: Resolve the release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      section: ${{ steps.resolve.outputs.section }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the release from the tag
        id: resolve
        run: |
          set -euo pipefail
          # The two version shapes, the track classification and the CHANGELOG
          # section live in hack/release.sh - the same script the maintainer runs
          # to cut the tag, so the two cannot drift.
          hack/release.sh --check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

          # Releases are cut from main: a tag on a commit main does not serve
          # would publish charts nobody can reach from the branch, and the
          # version would be recorded on a history that never had it.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} is not on main - releases are cut from main"
            exit 1
          fi

  images:
    name: Build and push images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: krot-cp
            dockerfile: Dockerfile.cp
          - name: krot-agent
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag is `release-<version>`, which is not a semver tag, so the
      # version is extracted with a match pattern rather than type=semver.
      # `latest` follows the stable track only: a candidate must never be what
      # an unqualified pull resolves to.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/arsolitt/${{ matrix.name }}
          tags: |
            type=match,pattern=release-(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc.') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Publish the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [release-tag, lint, test, charts, schema, licenses, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time: two tags pushed close together would otherwise
    # race on the same branch, and the loser fails on a non-fast-forward push
    # after its release already exists.
    concurrency: krot-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # The tag carries the version, and the tagged tree still records the
      # *previous* release (the recording commit lands on main only after this
      # job), so the packages are stamped from the tag: `--version` stamps
      # Chart.yaml and `--app-version` appVersion, which the charts' default
      # image tag follows. Charts are discovered rather than listed, so a third
      # chart is released without touching this file. Each artifact is then read
      # back: a package missing either field would publish under a tag the index
      # points at.
      - name: Package the charts at the released version
        env:
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages
          charts=()
          for candidate in charts/*/Chart.yaml; do
            [ -e "$candidate" ] || continue
            charts+=("$(dirname "$candidate")")
          done
          [ "${#charts[@]}" -gt 0 ] || { echo "::error::no charts found under charts/"; exit 1; }
          for chart in "${charts[@]}"; do
            helm package "$chart" --version "$VERSION" --app-version "$VERSION" --destination .cr-release-packages
            name=$(awk '/^name:/ { print $2; exit }' "$chart/Chart.yaml")
            package=".cr-release-packages/${name}-${VERSION}.tgz"
            if [ ! -f "$package" ]; then
              echo "::error::helm package produced no ${package}"
              exit 1
            fi
            packaged=$(tar -xzOf "$package" "${name}/Chart.yaml")
            if ! grep -qE "^version: \"?${VERSION}\"?$" <<<"$packaged"; then
              echo "::error::the packaged chart ${name} does not carry ${VERSION} in its version field"
              exit 1
            fi
            if ! grep -qE "^appVersion: \"?${VERSION}\"?$" <<<"$packaged"; then
              echo "::error::the packaged chart ${name} does not carry ${VERSION} in its appVersion field"
              exit 1
            fi
            echo "::notice::packaged $(basename "$package") from the tag"
          done

      # The release is created here rather than by `cr upload`, because `cr`
      # cannot create a pre-release and a candidate that exists unflagged - even
      # for the seconds between two steps - is a release consumers see as
      # stable. The flag and the body are part of the create call, and a re-run
      # after a failed step finds the release and updates it instead, so the
      # step is idempotent.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
          SECTION: ${{ needs.release-tag.outputs.section }}
          CHANNEL: ${{ needs.release-tag.outputs.channel }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          trap 'rm -f "$notes"' EXIT
          hack/release-notes.sh "$VERSION" "$SECTION" > "$notes"
          args=(--title "$TAG" --notes-file "$notes")
          if [ "$CHANNEL" = "rc" ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
          else
            gh release create "$TAG" --verify-tag "${args[@]}"
          fi
          gh release upload "$TAG" .cr-release-packages/*.tgz --clobber
          echo "::notice::$TAG published from the ${CHANNEL} track with the CHANGELOG.md body"

      # The license bundle is a separate asset rather than a file inside
      # .cr-release-packages: chart-releaser reads that directory as a set of
      # chart packages, so anything non-chart in it breaks the index. The
      # tarball is built from the tagged tree - the same tree the charts are
      # packaged from - and read back with `tar -tzf` before it is uploaded,
      # because an archive that silently dropped the bundle would publish as
      # if it carried the notice. Uploading with `--clobber` keeps a re-run
      # idempotent, exactly like the chart upload above.
      - name: Attach the license bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist-licenses
          mkdir -p dist-licenses
          asset="dist-licenses/krot-licenses-${VERSION}.tar.gz"
          tar -czf "$asset" LICENSE licenses

          listing=$(tar -tzf "$asset")
          for member in LICENSE licenses/README.md; do
            if ! grep -qxF "$member" <<<"$listing"; then
              echo "::error::${asset} does not carry ${member}"
              exit 1
            fi
          done

          gh release upload "$TAG" "$asset" --clobber
          echo "::notice::$(basename "$asset") attached to ${TAG}"

      # Only the pinned `cr` binary is taken from the action; its own release
      # path packages "charts changed since the previous tag", which is not the
      # contract here - the tag is what selects the version.
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          version: ${{ env.CHART_RELEASER_VERSION }}
          install_only: true

      # `cr index` reads the release and its assets back out of GitHub and
      # rewrites `index.yaml` on gh-pages; the packages it indexes are the ones
      # this job built. It keeps its local copy of the index at
      # `.cr-index/index.yaml` and does not create that directory, so it is
      # created here first. `cr` looks the release up *by tag*: the tag it looks
      # for is the release-name template it is given, and the template below
      # names the prefix this pipeline pushes (`release-<version>`). The default
      # is `<chart>-<version>`, so without the template the lookup would fail.
      - name: Publish the chart repository index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p .cr-index
          cr index -o "$owner" -r "$repo" \
            --release-name-template 'release-{{ .Version }}' \
            --push

      # The tag is the source of truth, so the branch records the release after
      # the fact: a commit whose only change is the version lines. Charts are
      # discovered the same way the packaging step discovers them. A push made
      # with GITHUB_TOKEN starts no run by itself, and `[skip ci]` keeps the
      # commit out of a pipeline if the token ever changes to a PAT.
      - name: Record the released version on main
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main

          charts=()
          for candidate in charts/*/Chart.yaml; do
            [ -e "$candidate" ] || continue
            charts+=("$(dirname "$candidate")")
          done
          [ "${#charts[@]}" -gt 0 ] || { echo "::error::no charts found under charts/"; exit 1; }

          changed=0
          for chart in "${charts[@]}"; do
            current=$(awk '/^version:/ { print $2; exit }' "$chart/Chart.yaml")
            if [ "$current" = "$VERSION" ]; then
              echo "::notice::$chart already records ${VERSION}"
              continue
            fi

            # main never moves backwards: a release cut from an older commit (a
            # backfill of an old line) publishes and leaves the branch alone.
            core_current="${current%%-*}"
            core_released="${VERSION%%-*}"
            if [ "$core_current" != "$core_released" ]; then
              lower=$(printf '%s\n%s\n' "$core_current" "$core_released" | sort -V | head -n1)
              if [ "$lower" = "$core_released" ]; then
                echo "::warning::$chart records ${current}, which is newer than ${VERSION} - left alone"
                continue
              fi
            fi

            sed -i -E "s/^version: .*/version: ${VERSION}/" "$chart/Chart.yaml"
            sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$chart/Chart.yaml"
            grep -qxF "version: ${VERSION}" "$chart/Chart.yaml"
            changed=1
          done

          if [ "$changed" -eq 0 ]; then
            echo "::notice::main already records ${VERSION}; nothing to commit"
            exit 0
          fi

          # The discovered chart directories, as the manifests the commit records.
          manifests=("${charts[@]/%//Chart.yaml}")
          git add "${manifests[@]}"
          git commit --message "chore(release): record ${TAG} [skip ci]"
          git push --quiet origin main
          echo "::notice::main now records ${VERSION}"

      - name: Summarize
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          CHANNEL: ${{ needs.release-tag.outputs.channel }}
          VERSION: ${{ needs.release-tag.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### krot release"
            echo ""
            echo "- \`${TAG}\` published from the ${CHANNEL} track"
            echo "- images: \`ghcr.io/arsolitt/krot-cp:${VERSION}\`, \`ghcr.io/arsolitt/krot-agent:${VERSION}\`"
            echo "- charts recorded on main: \`${VERSION}\`"
            echo "- license bundle: \`krot-licenses-${VERSION}.tar.gz\`"
            echo "- index: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
